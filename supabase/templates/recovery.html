<!doctype html>
<html lang="en">
<body style="font-family:Arial,sans-serif;line-height:1.6;color:#0f172a">
  <h2>Reset your password</h2>
  <p>A password reset was requested for {{ .Email }}.</p>
  <p><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 18px;border-radius:8px;color:#ffffff;background:#0f766e;text-decoration:none">Choose a new password</a></p>
  <p>If you did not request this, you can safely ignore this email. The link is single-use and expires.</p>
</body>
</html>
