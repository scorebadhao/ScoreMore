<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="ScoreMore student dashboard, tests and attempt workspace." />
  <title>ScoreMore Student</title>
  <link rel="stylesheet" href="./assets/css/main.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <a class="brand" href="./student.html#home" aria-label="ScoreMore student home">
        <span class="brand-mark">S+</span>
        <span>
          <strong id="brandName">ScoreMore</strong>
          <small id="brandTagline">Prepare smarter</small>
        </span>
      </a>
      <div class="topbar-actions">
        <span id="syncState" class="sync-state" aria-live="polite">Online</span>
        <button id="signOutButton" class="button button-ghost hidden" type="button">Sign out</button>
      </div>
    </header>

    <main>
      <section id="setupNotice" class="notice notice-warning hidden" role="status">
        Add the Supabase URL and publishable key to your environment before running ScoreMore.
      </section>

      <section id="studentLoading" class="section loading-state">Checking your ScoreMore session…</section>

      <section id="studentView" class="hidden">
        <div class="dashboard-header">
          <div>
            <span class="eyebrow">Student dashboard</span>
            <h1 id="welcomeTitle">Welcome</h1>
            <p id="targetExamLabel">Your dynamic test catalogue is ready.</p>
          </div>
          <button id="continueAttemptButton" class="button button-primary hidden" type="button">Continue Test</button>
        </div>

        <div class="dashboard-grid">
          <button class="dashboard-card" data-test-filter="PYQ_FULL" type="button"><strong>Previous Papers</strong><span>Original date and shift papers</span></button>
          <button class="dashboard-card" data-test-filter="PYQ_SECTIONAL" type="button"><strong>Sectional Tests</strong><span>Subject-wise PYQ practice</span></button>
          <button class="dashboard-card" data-test-filter="FULL_MOCK" type="button"><strong>Full Mock Tests</strong><span>Complete exam simulations</span></button>
          <button class="dashboard-card" data-route="#bookmarks" type="button"><strong>Bookmarks</strong><span>Revise saved questions</span></button>
          <button class="dashboard-card" data-route="#mistakes" type="button"><strong>Mistake Revision</strong><span>Practice weak areas</span></button>
          <button class="dashboard-card" data-route="#results" type="button"><strong>My Performance</strong><span>Results and analytics</span></button>
        </div>

        <section id="catalogueSection" class="section">
          <div class="section-heading">
            <div>
              <span class="eyebrow">Dynamic catalogue</span>
              <h2 id="catalogueTitle">All Tests</h2>
            </div>
            <select id="testTypeFilter" aria-label="Filter tests by type">
              <option value="">All test types</option>
              <option value="PYQ_FULL">Previous papers</option>
              <option value="PYQ_SECTIONAL">Sectional</option>
              <option value="FULL_MOCK">Full mock</option>
              <option value="TOPIC_PRACTICE">Topic practice</option>
              <option value="DAILY_QUIZ">Daily quiz</option>
            </select>
          </div>
          <div id="studentTestList" class="card-grid" aria-live="polite"></div>
        </section>

        <section id="attemptSection" class="section hidden" aria-live="polite">
          <div id="testEngineRoot"></div>
        </section>
      </section>
    </main>

    <nav id="mobileNav" class="mobile-nav hidden" aria-label="Student navigation">
      <button data-route="#home" class="active" type="button">Home</button>
      <button data-route="#tests" type="button">Tests</button>
      <button data-route="#practice" type="button">Practice</button>
      <button data-route="#results" type="button">Results</button>
      <button data-route="#profile" type="button">Profile</button>
    </nav>
  </div>

  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./assets/js/student.js"></script>
</body>
</html>
