# SCOREMORE PATCH 6.2 — RANKTIGER RC WORKFLOW — FINAL
name: Prepare RankTiger Release Candidate — SAFE NO DEPLOY

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Candidate version, for example 1.0.0-rc.1'
        required: true
        default: '1.0.0-rc.1'
        type: string
      confirmation:
        description: 'Type PREPARE_RANKTIGER_RC exactly. This prepares an artifact only; it does NOT deploy.'
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-ranktiger-release-candidate
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Safety gate
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "PREPARE_RANKTIGER_RC" ]; then
            echo "Blocked: confirmation must be PREPARE_RANKTIGER_RC"
            exit 1
          fi

      - name: Checkout approved ScoreMore source
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require committed dependency lock before candidate build
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Blocked safely: package-lock.json is not committed in ScoreMore yet."
            echo "Run Bootstrap ScoreMore Dependency Lock — SAFE NO DEPLOY, download its artifact, then upload package-lock.json to the ScoreMore repository root."
            exit 1
          fi

      - name: Require RankTiger PROD browser-safe environment secrets
        shell: bash
        env:
          RANKTIGER_SUPABASE_PROJECT_ID: ${{ secrets.RANKTIGER_SUPABASE_PROJECT_ID }}
          RANKTIGER_SUPABASE_URL: ${{ secrets.RANKTIGER_SUPABASE_URL }}
          RANKTIGER_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.RANKTIGER_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$RANKTIGER_SUPABASE_PROJECT_ID" ] || [ -z "$RANKTIGER_SUPABASE_URL" ] || [ -z "$RANKTIGER_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Blocked safely: RankTiger PROD browser-safe Supabase/project identity values are missing."
            exit 1
          fi
          if [ "$RANKTIGER_SUPABASE_PROJECT_ID" = "stejewkuikvqpqotjnnt" ]; then
            echo "Blocked: RankTiger candidate target matches ScoreMore DEV project ID."
            exit 1
          fi
          EXPECTED_URL="https://${RANKTIGER_SUPABASE_PROJECT_ID}.supabase.co"
          if [ "${RANKTIGER_SUPABASE_URL%/}" != "$EXPECTED_URL" ]; then
            echo "Blocked: RankTiger PROD URL does not match RankTiger project ID."
            exit 1
          fi

      - name: Install exactly locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify complete ScoreMore → RankTiger candidate safety chain
        run: npm run verify:patch6

      - name: Verify RankTiger PROD public API is ready — READ ONLY
        shell: bash
        env:
          RANKTIGER_SUPABASE_URL: ${{ secrets.RANKTIGER_SUPABASE_URL }}
          RANKTIGER_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.RANKTIGER_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          AUTH_CODE="$(curl --silent --show-error --output /tmp/ranktiger-auth-settings.json --write-out '%{http_code}' \
            "${RANKTIGER_SUPABASE_URL%/}/auth/v1/settings" \
            -H "apikey: ${RANKTIGER_SUPABASE_PUBLISHABLE_KEY}")"
          if [ "$AUTH_CODE" != "200" ]; then
            echo "Blocked: RankTiger Auth API returned HTTP $AUTH_CODE."
            exit 1
          fi

          API="${RANKTIGER_SUPABASE_URL%/}/rest/v1"
          check_public() {
            local label="$1"
            local path="$2"
            local expected="$3"
            local out="/tmp/ranktiger-rc-${label}.json"
            local code
            code="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              "${API}/${path}" \
              -H "apikey: ${RANKTIGER_SUPABASE_PUBLISHABLE_KEY}")"
            if [ "$code" != "200" ]; then
              echo "Blocked: RankTiger public API check for $label returned HTTP $code."
              cat "$out" || true
              exit 1
            fi
            if ! grep -Fq "$expected" "$out"; then
              echo "Blocked: RankTiger public API check for $label did not return the expected production baseline."
              cat "$out" || true
              exit 1
            fi
          }

          check_public "board" "boards?select=board_id&board_id=eq.GSSSB&limit=1" '"board_id":"GSSSB"'
          check_public "exam" "exams?select=exam_id&exam_id=eq.CCE&limit=1" '"exam_id":"CCE"'
          check_public "hero" "app_settings?select=setting_key&setting_key=eq.hero_title&limit=1" '"setting_key":"hero_title"'
          echo "RankTiger PROD public baseline is reachable and ready for candidate build."

      - name: Build RankTiger production target
        env:
          VITE_SUPABASE_URL: ${{ secrets.RANKTIGER_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.RANKTIGER_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.RANKTIGER_TURNSTILE_SITE_KEY }}
        run: npm run build:ranktiger

      - name: Package RankTiger candidate release
        env:
          RANKTIGER_RELEASE_VERSION: ${{ inputs.release_version }}
          RANKTIGER_SUPABASE_PROJECT_ID: ${{ secrets.RANKTIGER_SUPABASE_PROJECT_ID }}
          RANKTIGER_SUPABASE_URL: ${{ secrets.RANKTIGER_SUPABASE_URL }}
          RANKTIGER_PROD_PUBLIC_BASELINE_VERIFIED: 'true'
        run: npm run package:ranktiger

      - name: Upload RankTiger release-candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ranktiger-${{ inputs.release_version }}-${{ github.sha }}
          path: release/ranktiger
          if-no-files-found: error
          retention-days: 30

      - name: Confirm candidate-only outcome
        shell: bash
        run: |
          echo "RankTiger release candidate prepared as a GitHub Actions artifact only."
          echo "RankTiger repository push: NO"
          echo "RankTiger PROD database migration: NO"
          echo "Cloudflare deployment: NO"
          echo "Student-facing domain deployment: NO"
