name: Repair ScoreMore DEV Migration History — ONE TIME

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REPAIR_SCOREMORE_DEV_20260805000050
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: scoremore-dev-migration-history-repair
  cancel-in-progress: false

jobs:
  repair-history:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Confirm one-time ScoreMore DEV history repair
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "REPAIR_SCOREMORE_DEV_20260805000050" ]; then
            echo "Confirmation text is incorrect."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Verify ScoreMore DEV project target
        run: |
          if [ "$SUPABASE_PROJECT_ID" != "stejewkuikvqpqotjnnt" ]; then
            echo "Refusing to repair history: project reference does not match ScoreMore DEV."
            exit 1
          fi

      - name: Verify exact local migration exists
        run: |
          test -f supabase/migrations/20260805000050_catalogue_parent_prerequisites.sql
          test -f supabase/migrations/20260811020000_public_catalogue_baseline.sql
          test -f supabase/migrations/20260814010000_draft_first_image_content_repair_workflow.sql

      - name: Link ScoreMore DEV Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration status before repair
        run: supabase migration list

      - name: Mark only the already-satisfied prerequisite migration as applied
        run: supabase migration repair 20260805000050 --status applied

      - name: Show migration status after repair
        run: supabase migration list

      - name: Preview normal ScoreMore DEV push after repair
        run: supabase db push --dry-run --include-seed
