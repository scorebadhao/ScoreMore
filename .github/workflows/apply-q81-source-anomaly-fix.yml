name: Apply ScoreMore Q81 Source-Anomaly Fix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_Q81_SOURCE_ANOMALY_FIX"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: scoremore-q81-source-anomaly-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'scorebadhao/ScoreMore'
    runs-on: ubuntu-latest

    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" != "APPLY_Q81_SOURCE_ANOMALY_FIX" ]; then
            echo "Confirmation text did not match."
            exit 1
          fi

      - name: Checkout ScoreMore main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify target files and current API contract
        shell: bash
        run: |
          test -f assets/js/admin.js
          test -f assets/js/api.js
          grep -q "confirmImportSourceOptionAnomaly" assets/js/api.js
          grep -q "importBatchItemsToDrafts" assets/js/api.js
          grep -q "confirm_import_source_option_anomaly" assets/js/api.js
          grep -q "import_valid_batch_items_to_drafts" assets/js/api.js

      - name: Patch assets/js/admin.js safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("assets/js/admin.js")
          text = path.read_text(encoding="utf-8")
          original = text
          MARKER = "// SCOREMORE_Q81_SOURCE_ANOMALY_FIX_V1"

          if MARKER in text:
              print("Q81 controlled source-anomaly fix is already present.")
              raise SystemExit(0)

          required = [
              "function isOccurrenceActionable(item) {",
              "function knownRepairableCount(report = currentImportReport) {",
              "function updateImportActionControls() {",
              "function renderPackageValidationFailure",
              "function importActionMarkup(item) {",
              "function requestImportConfirmation({ title, message, buttonLabel }) {",
              "async function importSelectedDrafts() {",
              "function bindEvents() {",
          ]
          missing = [anchor for anchor in required if anchor not in text]
          if missing:
              raise SystemExit(
                  "Refusing to patch: expected ScoreMore v1.5 anchors are missing: "
                  + " | ".join(missing)
              )

          helper_block = r'''
          // SCOREMORE_Q81_SOURCE_ANOMALY_FIX_V1
          function importItemErrorCodes(item) {
            return (item?.errors || [])
              .map((issue) => String(issue?.code || '').trim().toUpperCase())
              .filter(Boolean);
          }

          function isConfirmablePrintedDuplicateOptions(item) {
            const errorCodes = importItemErrorCodes(item);
            return Boolean(
              !item?.created_draft_id
              && item?.validation_status === 'INVALID'
              && String(item?.normalized_payload?.question_type || '').toUpperCase() === 'PYQ'
              && errorCodes.length === 1
              && errorCodes[0] === 'DUPLICATE_OPTIONS'
            );
          }

          function confirmablePrintedSourceAnomalyCount(report = currentImportReport) {
            return report?.items?.filter(isConfirmablePrintedDuplicateOptions).length || 0;
          }

          function duplicatePrintedOptionLabels(item) {
            const options = item?.normalized_payload?.options || {};
            const rows = ['A', 'B', 'C', 'D']
              .map((label) => [label, String(options?.[label] || '').trim().replace(/\s+/g, ' ')])
              .filter(([, value]) => value);
            const groups = new Map();
            rows.forEach(([label, value]) => {
              const key = value.toLocaleLowerCase();
              const labels = groups.get(key) || [];
              labels.push(label);
              groups.set(key, labels);
            });
            return [...groups.values()].filter((labels) => labels.length > 1);
          }

          '''
          text = text.replace(
              "function knownRepairableCount(report = currentImportReport) {",
              helper_block + "function knownRepairableCount(report = currentImportReport) {",
              1,
          )

          start = text.index("function knownRepairableCount(report = currentImportReport) {")
          end = text.index("function updateImportActionControls() {", start)
          replacement = r'''function knownRepairableCount(report = currentImportReport) {
            if (report?.summary && Object.prototype.hasOwnProperty.call(report.summary, 'repairable_items')) {
              return Number(report.summary.repairable_items || 0);
            }

            return report?.items?.filter((item) => (
              !item?.created_draft_id
              && !isConfirmablePrintedDuplicateOptions(item)
              && (
                Number(item?.fingerprint_version || 1) < 2
                || (item?.errors || []).some((issue) => issue?.code === 'DRAFT_INSERT_FAILED')
              )
            )).length || 0;
          }

          '''
          text = text[:start] + replacement + text[end:]

          update_start = text.index("function updateImportActionControls() {")
          update_end = text.index("function renderPackageValidationFailure", update_start)
          update_block = text[update_start:update_end]

          reusable_anchor = "  const reusable = Number(summary.reusable_duplicates || 0);"
          if reusable_anchor not in update_block:
              raise SystemExit("Refusing to patch: reusable-duplicate anchor missing.")
          update_block = update_block.replace(
              reusable_anchor,
              reusable_anchor
              + "\n  const sourceAnomalies = confirmablePrintedSourceAnomalyCount();"
              + "\n  const remainingErrors = Math.max(errors - sourceAnomalies, 0);",
              1,
          )

          summary_start = update_block.index("  if (elements.importSelectionSummary) {")
          new_summary_tail = r'''  if (elements.importSelectionSummary) {
              elements.importSelectionSummary.textContent = batchId
                ? `${imported} drafts exist. ${ready} new drafts are ready.${repairable ? ` ${repairable} older records will be rechecked automatically.` : ''}${reusable ? ` ${reusable} exact duplicate${reusable === 1 ? '' : 's'} will be reused safely.` : ''}${sourceAnomalies ? ` ${sourceAnomalies} printed source option anomal${sourceAnomalies === 1 ? 'y needs' : 'ies need'} explicit confirmation. Tap Import remaining drafts or use the Errors filter.` : ''}${remainingErrors ? ` ${remainingErrors} other genuine error${remainingErrors === 1 ? '' : 's'}/conflict${remainingErrors === 1 ? '' : 's'} still need attention.` : ''}${duplicates && !reusable ? ` ${duplicates} true duplicates were already resolved.` : ''}${occurrenceCount ? ` ${occurrenceCount} occurrence selected.` : ''}`
                : 'Validate a package, then use one button to import every remaining eligible draft.';
            }
          }

          '''
          update_block = update_block[:summary_start] + new_summary_tail
          text = text[:update_start] + update_block + text[update_end:]

          action_start = text.index("function importActionMarkup(item) {")
          possible_ends = [
              text.find("function bindImportItemSelections", action_start),
              text.find("function renderImportItems", action_start),
          ]
          possible_ends = [x for x in possible_ends if x != -1]
          if not possible_ends:
              raise SystemExit("Refusing to patch: cannot bound importActionMarkup().")
          action_end = min(possible_ends)
          action_block = text[action_start:action_end]
          imported_anchor = "  if (item.validation_status === 'IMPORTED_TO_DRAFT') {"
          if imported_anchor not in action_block:
              raise SystemExit("Refusing to patch: imported-draft anchor missing.")

          controlled_action = r'''  if (isConfirmablePrintedDuplicateOptions(item)) {
              const duplicateGroups = duplicatePrintedOptionLabels(item)
                .map((labels) => labels.join(' = '))
                .join(', ');
              return `
                <div class="import-resolution resolution-warning">
                  <strong>Printed duplicate options need confirmation</strong>
                  <span>The genuine PYQ source contains duplicate option text${duplicateGroups ? ` (${escapeHtml(duplicateGroups)})` : ''}. Preserve it exactly, record a source-traceability note, then create this controlled draft for Final Review.</span>
                  <button
                    class="button button-primary"
                    type="button"
                    data-confirm-source-option-anomaly="${escapeHtml(item.import_item_id)}"
                  >Confirm source & create draft</button>
                </div>
              `;
            }

          '''
          action_block = action_block.replace(imported_anchor, controlled_action + imported_anchor, 1)
          text = text[:action_start] + action_block + text[action_end:]

          confirm_anchor = "function requestImportConfirmation({ title, message, buttonLabel }) {"
          confirm_pos = text.index(confirm_anchor)

          confirmation_functions = r'''function requestSourceOptionAnomalyConfirmation(item) {
            return new Promise((resolve) => {
              let settled = false;
              const finish = (value) => {
                if (settled) return;
                settled = true;
                resolve(value);
              };

              const question = item?.normalized_payload || {};
              const sourceLabel = [
                question.paper_code || currentImportReport?.batch?.paper_code,
                question.original_question_no ? `Q${question.original_question_no}` : item?.source_record_id,
                question.source_page ? `page ${question.source_page}` : '',
              ].filter(Boolean).join(' · ');
              const duplicateGroups = duplicatePrintedOptionLabels(item)
                .map((labels) => labels.join(' = '))
                .join(', ');
              const defaultNote = `Checked against the original source${sourceLabel ? ` (${sourceLabel})` : ''}. The genuine PYQ prints identical option text${duplicateGroups ? ` in ${duplicateGroups}` : ' in more than one option'}. Preserve all option text exactly as printed. Record as DUPLICATE_OPTIONS_PRINTED. The proposed answer remains unverified and requires human review.`;

              elements.dialogContent.innerHTML = `
                <div class="review-content">
                  <span class="eyebrow">Controlled source anomaly</span>
                  <h2>Confirm printed duplicate options</h2>
                  <p>${escapeHtml(sourceLabel || item?.proposed_question_id || 'This genuine PYQ record')}</p>
                  ${duplicateGroups ? `<p><strong>Duplicate printed labels:</strong> ${escapeHtml(duplicateGroups)}</p>` : ''}
                  <div class="import-safety-note">
                    <strong>Source preservation</strong>
                    <span>This does not fix, merge or rewrite the printed options. It records the genuine source anomaly and creates only a draft for human review. Nothing is published.</span>
                  </div>
                  <label class="field">
                    <span>Source traceability note</span>
                    <textarea id="sourceOptionAnomalyNote" rows="5" required>${escapeHtml(defaultNote)}</textarea>
                  </label>
                  <div class="draft-item-actions">
                    <button id="confirmSourceOptionAnomaly" class="button button-primary" type="button">Confirm & create draft</button>
                    <button id="cancelSourceOptionAnomaly" class="button button-ghost" type="button">Cancel</button>
                  </div>
                </div>
              `;

              elements.dialogContent.querySelector('#confirmSourceOptionAnomaly')?.addEventListener('click', () => {
                const note = elements.dialogContent.querySelector('#sourceOptionAnomalyNote')?.value?.trim() || '';
                if (!note) {
                  toast.warning('Add a source traceability note before confirming the printed duplicate options.');
                  return;
                }
                finish(note);
                elements.dialog.close();
              });

              elements.dialogContent.querySelector('#cancelSourceOptionAnomaly')?.addEventListener('click', () => {
                finish(null);
                elements.dialog.close();
              });

              elements.dialog.addEventListener('close', () => finish(null), { once: true });
              elements.dialog.showModal();
            });
          }

          async function confirmPrintedSourceOptionAnomaly(importItemId) {
            const batchId = currentImportReport?.batch?.import_batch_id;
            const item = currentImportReport?.items?.find((row) => row.import_item_id === importItemId);

            if (!batchId || !item) {
              toast.error('Open the current import report and try again.');
              return false;
            }

            if (!isConfirmablePrintedDuplicateOptions(item)) {
              toast.warning('This record is not eligible for the printed duplicate-option exception.');
              return false;
            }

            const note = await requestSourceOptionAnomalyConfirmation(item);
            if (!note) return false;

            const loading = toast.loading('Confirming the printed source anomaly…');
            try {
              const confirmation = await api.confirmImportSourceOptionAnomaly({
                importItemId,
                note,
              });

              const status = String(confirmation?.status || '').toUpperCase();
              if (!['VALID', 'VALID_WITH_WARNINGS'].includes(status)) {
                throw new Error(`The source anomaly was recorded, but the item is still ${status || 'blocked'}.`);
              }

              loading.update?.('Creating the controlled draft…');

              await api.importBatchItemsToDrafts({
                importBatchId: batchId,
                importItemIds: [importItemId],
              });

              await api.reconcileImportBatchState(batchId);
              const report = await api.getImportBatchReport(batchId);
              renderImportReport(report);

              await Promise.all([
                loadDrafts({ reset: true }),
                loadRecentImportBatches(),
              ]);
              renderAdminDashboard();

              loading.close();
              toast.success('Printed source anomaly confirmed. Draft created for Final Review. Nothing was published.');
              return true;
            } catch (error) {
              loading.close();
              toast.error(error.message);
              try {
                const report = await api.getImportBatchReport(batchId);
                renderImportReport(report);
              } catch {
                // Preserve the original actionable error.
              }
              return false;
            }
          }

          '''
          text = text[:confirm_pos] + confirmation_functions + text[confirm_pos:]

          import_start = text.index("async function importSelectedDrafts() {")
          next_candidates = [
              text.find("async function syncCurrentImportBatch", import_start),
              text.find("async function repairCurrentImportBatch", import_start),
              text.find("async function resetCurrentImportDrafts", import_start),
          ]
          next_candidates = [x for x in next_candidates if x != -1]
          if not next_candidates:
              raise SystemExit("Refusing to patch: cannot bound importSelectedDrafts().")
          import_end = min(next_candidates)
          import_block = text[import_start:import_end]
          batch_anchor = "  const batchId = currentImportReport?.batch?.import_batch_id;"
          if batch_anchor not in import_block:
              raise SystemExit("Refusing to patch: batch anchor missing in importSelectedDrafts().")
          import_block = import_block.replace(
              batch_anchor,
              batch_anchor
              + "\n  const pendingSourceAnomaly = currentImportReport?.items?.find(isConfirmablePrintedDuplicateOptions);"
              + "\n  if (batchId && pendingSourceAnomaly) {"
              + "\n    await confirmPrintedSourceOptionAnomaly(pendingSourceAnomaly.import_item_id);"
              + "\n    return;"
              + "\n  }",
              1,
          )
          text = text[:import_start] + import_block + text[import_end:]

          bind_start = text.index("function bindEvents() {")
          bind_end = text.index("async function initialize()", bind_start)
          bind_block = text[bind_start:bind_end]
          event_anchor = (
              "  elements.importItemFilter?.addEventListener('change', () => "
              "{ visibleImportItemLimit = IMPORT_ITEM_PAGE_SIZE; renderImportItems(); });"
          )
          if event_anchor not in bind_block:
              raise SystemExit("Refusing to patch: import item filter event anchor missing.")
          event_code = r'''
            elements.importItemList?.addEventListener('click', (event) => {
              const button = event.target.closest('[data-confirm-source-option-anomaly]');
              if (!button) return;
              confirmPrintedSourceOptionAnomaly(button.dataset.confirmSourceOptionAnomaly);
            });'''
          bind_block = bind_block.replace(event_anchor, event_anchor + event_code, 1)
          text = text[:bind_start] + bind_block + text[bind_end:]

          must_contain = [
              MARKER,
              "isConfirmablePrintedDuplicateOptions",
              "Object.prototype.hasOwnProperty.call(report.summary, 'repairable_items')",
              "data-confirm-source-option-anomaly",
              "requestSourceOptionAnomalyConfirmation",
              "api.confirmImportSourceOptionAnomaly",
              "api.importBatchItemsToDrafts",
              "DUPLICATE_OPTIONS_PRINTED",
              "Nothing was published",
          ]
          missing_after = [value for value in must_contain if value not in text]
          if missing_after:
              raise SystemExit("Patched file failed self-check: " + " | ".join(missing_after))

          if text == original:
              raise SystemExit("No changes were made.")

          path.write_text(text, encoding="utf-8")
          print("Patched assets/js/admin.js")
          PY

      - name: Static validation
        shell: bash
        run: |
          node --check assets/js/admin.js
          node --check assets/js/api.js
          git diff --check
          grep -q "SCOREMORE_Q81_SOURCE_ANOMALY_FIX_V1" assets/js/admin.js
          grep -q "data-confirm-source-option-anomaly" assets/js/admin.js
          grep -q "confirmImportSourceOptionAnomaly" assets/js/admin.js
          grep -q "importBatchItemsToDrafts" assets/js/admin.js
          grep -q "DUPLICATE_OPTIONS_PRINTED" assets/js/admin.js

      - name: Show controlled diff
        shell: bash
        run: |
          git status --short
          git diff -- assets/js/admin.js

      - name: Commit frontend-only fix
        shell: bash
        run: |
          if git diff --quiet -- assets/js/admin.js; then
            echo "No commit needed; fix was already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/admin.js
          git commit -m "Fix printed source anomaly draft recovery"
          git push origin HEAD:main
